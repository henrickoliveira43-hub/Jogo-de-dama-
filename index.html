<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Damas — Regra Brasileira Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-base: #080a0f;
            --bg-surface: #10141d;
            --bg-surface-elevated: #171d2a;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.18);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --ruby: #f43f5e;
            --ruby-glow: rgba(244, 63, 94, 0.35);
            --cyan: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.35);
            --amber: #f59e0b;

            --board-light: #161e2e;
            --board-dark: #0b1019;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(6, 182, 212, 0.08), transparent),
                radial-gradient(circle at 100% 100%, rgba(244, 63, 94, 0.05), transparent 50%);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 480px;
            z-index: 10;
        }

        /* HEADER PROFISSIONAL */
        .app-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .brand-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }
        .net-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--cyan);
        }

        /* CONTROLES / SEGMENTOS */
        .toolbar {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .segmented-control {
            display: flex;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 3px;
            border-radius: 10px;
            width: 100%;
        }
        .segment-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .segment-btn:hover { color: var(--text-primary); }
        .segment-btn.active {
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            border: 1px solid var(--border-active);
        }

        .actions-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }
        .btn-action {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-action:hover { border-color: var(--border-active); color: var(--text-primary); }
        .btn-action.active {
            border-color: var(--amber);
            color: var(--amber);
            background: rgba(245, 158, 11, 0.08);
        }
        .badge-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            background: rgba(255,255,255,0.1);
            padding: 1px 5px;
            border-radius: 4px;
        }

        /* PLACAR SLATE PRO */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
        .player-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.45;
            position: relative;
        }
        .player-card.active {
            opacity: 1;
            background: var(--bg-surface-elevated);
            border-color: var(--border-active);
        }
        .player-card.red.active { box-shadow: 0 0 20px -5px var(--ruby-glow); }
        .player-card.black.active { box-shadow: 0 0 20px -5px var(--cyan-glow); }

        .player-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-name {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .player-card.active .player-name { color: var(--text-primary); }
        .status-tag {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }
        .player-card.red .status-tag { background: rgba(244, 63, 94, 0.15); color: var(--ruby); }
        .player-card.black .status-tag { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }

        .score-val {
            font-size: 1.4rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .clock-display {
            font-size: 0.75rem;
            color: var(--amber);
            font-weight: 600;
        }

        /* ESTATÍSTICAS INTEGRADAS */
        .stats-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 6px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-muted);
        }
        .stats-bar b { color: var(--text-primary); font-weight: 700; }

        /* TABULEIRO PREMIUM */
        .board-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            padding: 6px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .board {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .cell.light { background-color: var(--board-light); }
        .cell.dark { background-color: var(--board-dark); }

        /* PEÇAS COM ACABAMENTO METÁLICO/VIDRO */
        .piece {
            width: 76%;
            height: 76%;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .piece.red {
            background: radial-gradient(circle at 35% 35%, #ff6b81, #f43f5e 60%, #be123c);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 2px 3px rgba(255, 255, 255, 0.3);
        }
        .piece.black {
            background: radial-gradient(circle at 35% 35%, #22d3ee, #06b6d4 60%, #0e7490);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 2px 3px rgba(255, 255, 255, 0.4);
        }
        .piece.selected {
            transform: scale(1.12);
            box-shadow: 0 0 0 3px var(--bg-base), 0 0 0 5px var(--text-primary);
        }
        .piece.king::after {
            content: '♔';
            color: #080a0f;
            font-size: clamp(14px, 3.6vw, 22px);
            font-weight: 800;
            text-shadow: 0 1px 2px rgba(255,255,255,0.4);
        }

        /* ANIMAÇÃO DA DANÇA DA VITÓRIA */
        .piece.victory-dance {
            animation: victoryPulse 1s infinite alternate ease-in-out;
        }

        @keyframes victoryPulse {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.18); box-shadow: 0 0 18px currentColor; }
        }

        .cell.valid::after {
            content: '';
            width: 22%;
            height: 22%;
            background: var(--amber);
            border-radius: 50%;
            position: absolute;
            z-index: 3;
            pointer-events: none;
            box-shadow: 0 0 8px var(--amber);
        }
        .cell.hint-glow::before {
            content: '';
            position: absolute;
            inset: 3px;
            border: 2px dashed var(--amber);
            border-radius: 6px;
            pointer-events: none;
        }

        /* MODAIS E TOASTS DE CELEBRAÇÃO */
        #celebrationCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 90; }

        .combo-toast {
            position: fixed; top: 12%; left: 50%; transform: translate(-50%, -10px); z-index: 95;
            font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1rem;
            color: var(--amber); background: var(--bg-surface-elevated); border: 1px solid var(--border-active);
            padding: 8px 18px; border-radius: 99px; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .combo-toast.show { opacity: 1; transform: translate(-50%, 0); }

        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(8, 10, 15, 0.88); backdrop-filter: blur(12px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease; padding: 20px;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: var(--bg-surface); border: 1px solid var(--border-active);
            padding: 32px 28px; border-radius: 20px; text-align: center; max-width: 350px; width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            transform: scale(0.85); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-card.red-theme { border-color: var(--ruby); box-shadow: 0 0 35px var(--ruby-glow); }
        .modal-card.black-theme { border-color: var(--cyan); box-shadow: 0 0 35px var(--cyan-glow); }

        .modal-icon { font-size: 2.8rem; margin-bottom: 8px; animation: bounce 1s infinite alternate; }
        .modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
        .modal-desc { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 22px; line-height: 1.45; }
        .btn-primary {
            background: var(--cyan); color: #080a0f; border: none; padding: 12px 20px;
            border-radius: 10px; font-size: 0.88rem; font-weight: 800; cursor: pointer;
            width: 100%; transition: filter 0.2s ease, transform 0.1s;
        }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-primary:active { transform: scale(0.98); }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    </style>
</head>
<body>

    <canvas id="celebrationCanvas"></canvas>
    <div class="combo-toast" id="comboToast"></div>

    <div class="game-wrapper">
        <header class="app-header">
            <div class="brand">
                <span class="brand-dot"></span> Cyber Damas (Regra BR)
            </div>
            <span class="net-badge" id="netStatus">CONECTANDO...</span>
        </header>

        <div class="toolbar">
            <div class="segmented-control">
                <button class="segment-btn active" id="vsPlayerBtn">Jogador vs Jogador</button>
                <button class="segment-btn" id="vsAiBtn">Contra IA</button>
            </div>

            <div class="segmented-control" id="difficultyRow" style="display:none;">
                <button class="segment-btn" data-diff="easy">Fácil</button>
                <button class="segment-btn active" data-diff="medium">Médio</button>
                <button class="segment-btn" data-diff="hard">Difícil</button>
            </div>

            <div class="actions-row">
                <button class="btn-action" id="soundBtn">🔊 Som</button>
                <button class="btn-action" id="blitzBtn">⏱ Blitz</button>
                <button class="btn-action" id="hintBtn">💡 Dica <span class="badge-count" id="hintBadge">3</span></button>
            </div>
        </div>

        <div class="scoreboard">
            <div class="player-card red active" id="card-red">
                <div class="player-meta">
                    <span class="player-name">Você (Rubi)</span>
                    <span class="status-tag">Sua Vez</span>
                </div>
                <div class="score-val">
                    <span id="count-red" style="color: var(--ruby)">12</span>
                    <span class="clock-display" id="clock-red"></span>
                </div>
            </div>

            <div class="player-card black" id="card-black">
                <div class="player-meta">
                    <span class="player-name" id="name-black">Jogador 2</span>
                    <span class="status-tag" id="tag-black">Aguardando</span>
                </div>
                <div class="score-val">
                    <span id="count-black" style="color: var(--cyan)">12</span>
                    <span class="clock-display" id="clock-black"></span>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <span>Partidas: <b id="statGames">0</b></span>
            <span id="statWinsWrap" style="display:none;">Vitórias: <b id="statWins">0</b></span>
            <span id="statLossesWrap" style="display:none;">Derrotas: <b id="statLosses">0</b></span>
            <span>Rede Global: <b id="globalGames">...</b></span>
        </div>

        <div class="board-container">
            <div class="board" id="board"></div>
        </div>
    </div>

    <div class="modal-overlay" id="victoryScreen">
        <div class="modal-card" id="modalCard">
            <div class="modal-icon">🏆</div>
            <h2 class="modal-title" id="winnerTitle">Vitória!</h2>
            <p class="modal-desc" id="winnerSubText">Partida finalizada com sucesso.</p>
            <button class="btn-primary" id="restartBtn">Jogar Novamente</button>
        </div>
    </div>

    <!-- Módulo Firebase com Diagnóstico -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6hQbsB-S8fJXwGXI2AZHGx2Ze1LM2bzY",
            authDomain: "gen-lang-client-0148180315.firebaseapp.com",
            projectId: "gen-lang-client-0148180315",
            storageBucket: "gen-lang-client-0148180315.firebasestorage.app",
            messagingSenderId: "128524317639",
            appId: "1:128524317639:web:fc4284e3f6609f91a15fe2"
        };

        const netStatusEl = document.getElementById('netStatus');
        const globalGamesEl = document.getElementById('globalGames');

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const globalStatsDoc = doc(db, "cyber_damas", "global_network");

            onSnapshot(globalStatsDoc, (docSnap) => {
                if (docSnap.exists()) {
                    globalGamesEl.textContent = docSnap.data().totalMatches || 0;
                    netStatusEl.textContent = 'REDE CONECTADA';
                    console.log("✅ Firebase Firestore conectado com sucesso!");
                } else {
                    setDoc(globalStatsDoc, { totalMatches: 1 }, { merge: true });
                    netStatusEl.textContent = 'REDE CONECTADA';
                }
            }, (err) => {
                console.warn("⚠️ Firestore em modo de erro ou sem permissão:", err);
                netStatusEl.textContent = 'OFFLINE/LOCAL';
                globalGamesEl.textContent = 'OFFLINE';
            });

            window.syncGameToFirebase = async function(winnerIsUser) {
                try {
                    await updateDoc(globalStatsDoc, {
                        totalMatches: increment(1),
                        userWins: winnerIsUser ? increment(1) : increment(0)
                    });
                    console.log("☁️ Partida registrada no banco de dados com sucesso!");
                } catch (e) {
                    try {
                        await setDoc(globalStatsDoc, { totalMatches: 1 }, { merge: true });
                    } catch(err) {
                        console.error("❌ Erro ao atualizar no banco de dados:", err);
                    }
                }
            };
        } catch (err) {
            console.error("❌ Erro ao inicializar o Firebase:", err);
            netStatusEl.textContent = 'RODE VIA LIVE SERVER';
        }
    </script>

    <!-- Lógica de Jogo, IA, Dama Voadora, Sons e Animações -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Áudio Sintetizado Nativo
            class SoundSystem {
                constructor() { this.enabled = true; this.ctx = null; }
                init() {
                    if (!this.ctx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) this.ctx = new AudioContext();
                    }
                }
                playTone(freq, duration, type = 'sine', gainVal = 0.06) {
                    if (!this.enabled) return;
                    this.init();
                    if (!this.ctx) return;
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    } catch (e) {}
                }
                click() { this.playTone(600, 0.03, 'sine', 0.04); }
                move() { this.playTone(340, 0.05, 'triangle', 0.05); }
                capture() {
                    this.playTone(200, 0.08, 'sawtooth', 0.08);
                    setTimeout(() => this.playTone(400, 0.08, 'sine', 0.08), 40);
                }
                king() {
                    [523, 659, 783].forEach((f, idx) => {
                        setTimeout(() => this.playTone(f, 0.1, 'triangle', 0.06), idx * 50);
                    });
                }
                win() {
                    [440, 554, 659, 880, 1046].forEach((f, idx) => {
                        setTimeout(() => this.playTone(f, 0.22, 'sine', 0.1), idx * 80);
                    });
                }
                lose() {
                    [350, 300, 250].forEach((f, idx) => {
                        setTimeout(() => this.playTone(f, 0.15, 'sawtooth', 0.06), idx * 80);
                    });
                }
            }
            const sound = new SoundSystem();

            // --- SISTEMA DE CELEBRAÇÃO E CONFETES PERSONALIZADO ---
            const canvas = document.getElementById('celebrationCanvas');
            const ctx = canvas.getContext('2d');
            let confettiParticles = [];
            let confettiAnimId = null;

            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function spawnConfetti(winnerColor = 'red') {
                confettiParticles = [];
                const colors = winnerColor === 'red'
                    ? ['#f43f5e', '#ff6b81', '#f59e0b', '#ffffff'] // Rubi/Ouro
                    : ['#06b6d4', '#22d3ee', '#38bdf8', '#ffffff']; // Ciano/Azul

                for (let i = 0; i < 110; i++) {
                    confettiParticles.push({
                        x: canvas.width / 2,
                        y: canvas.height / 2,
                        vx: (Math.random() - 0.5) * 16,
                        vy: (Math.random() - 0.8) * 16,
                        size: Math.random() * 6 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.2,
                        life: 1,
                        shape: Math.random() > 0.4 ? 'rect' : 'circle'
                    });
                }
                if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
                animateConfetti();
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                confettiParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.22;
                    p.rotation += p.vRot;
                    p.life -= 0.012;

                    if (p.life > 0) {
                        alive = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = Math.max(0, p.life);

                        if (p.shape === 'rect') {
                            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4);
                        } else {
                            ctx.beginPath();
                            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                });
                if (alive) confettiAnimId = requestAnimationFrame(animateConfetti);
            }

            // Game State
            const RED = 'red';
            const BLACK = 'black';
            const BOARD_SIZE = 8;

            let boardState = [];
            let turn = RED;
            let mode = 'pvp';
            let aiDifficulty = 'medium';
            let selectedPos = null;
            let validMoves = [];
            let mustCaptureFrom = null;
            let comboCount = 0;

            let hintsRemaining = 3;
            let blitzMode = false;
            let blitzTimeLeft = 15;
            let blitzTimerInterval = null;

            let totalGames = 0, wins = 0, losses = 0;

            const boardEl = document.getElementById('board');
            const vsPlayerBtn = document.getElementById('vsPlayerBtn');
            const vsAiBtn = document.getElementById('vsAiBtn');
            const difficultyRow = document.getElementById('difficultyRow');
            const soundBtn = document.getElementById('soundBtn');
            const blitzBtn = document.getElementById('blitzBtn');
            const hintBtn = document.getElementById('hintBtn');
            const hintBadge = document.getElementById('hintBadge');

            const cardRed = document.getElementById('card-red');
            const cardBlack = document.getElementById('card-black');
            const countRed = document.getElementById('count-red');
            const countBlack = document.getElementById('count-black');
            const nameBlack = document.getElementById('name-black');
            const tagBlack = document.getElementById('tag-black');
            const clockRed = document.getElementById('clock-red');
            const clockBlack = document.getElementById('clock-black');

            const comboToast = document.getElementById('comboToast');
            const victoryScreen = document.getElementById('victoryScreen');
            const modalCard = document.getElementById('modalCard');
            const winnerTitle = document.getElementById('winnerTitle');
            const winnerSubText = document.getElementById('winnerSubText');
            const restartBtn = document.getElementById('restartBtn');

            function loadStats() {
                totalGames = parseInt(localStorage.getItem('cyberDamas_games') || '0', 10);
                wins = parseInt(localStorage.getItem('cyberDamas_wins') || '0', 10);
                losses = parseInt(localStorage.getItem('cyberDamas_losses') || '0', 10);
                updateStatsUI();
            }

            function saveStats() {
                localStorage.setItem('cyberDamas_games', totalGames);
                localStorage.setItem('cyberDamas_wins', wins);
                localStorage.setItem('cyberDamas_losses', losses);
                updateStatsUI();
            }

            function updateStatsUI() {
                document.getElementById('statGames').textContent = totalGames;
                document.getElementById('statWins').textContent = wins;
                document.getElementById('statLosses').textContent = losses;

                if (mode === 'ai') {
                    document.getElementById('statWinsWrap').style.display = 'inline';
                    document.getElementById('statLossesWrap').style.display = 'inline';
                } else {
                    document.getElementById('statWinsWrap').style.display = 'none';
                    document.getElementById('statLossesWrap').style.display = 'none';
                }
            }

            function initGame() {
                boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if ((r + c) % 2 === 1) {
                            if (r < 3) boardState[r][c] = { color: BLACK, isKing: false };
                            else if (r > 4) boardState[r][c] = { color: RED, isKing: false };
                        }
                    }
                }
                turn = RED;
                selectedPos = null;
                validMoves = [];
                mustCaptureFrom = null;
                comboCount = 0;
                hintsRemaining = 3;
                hintBadge.textContent = hintsRemaining;

                victoryScreen.classList.remove('show');
                modalCard.classList.remove('red-theme', 'black-theme');
                renderBoard();
                updateUI();
                resetBlitzTimer();
            }

            function renderBoard() {
                boardEl.innerHTML = '';
                let redCount = 0, blackCount = 0;

                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const cell = document.createElement('div');
                        const isDark = (r + c) % 2 === 1;
                        cell.className = `cell ${isDark ? 'dark' : 'light'}`;
                        cell.dataset.row = r;
                        cell.dataset.col = c;

                        const piece = boardState[r][c];
                        if (piece) {
                            if (piece.color === RED) redCount++;
                            else blackCount++;

                            const pieceEl = document.createElement('div');
                            pieceEl.className = `piece ${piece.color}${piece.isKing ? ' king' : ''}`;
                            pieceEl.dataset.color = piece.color;
                            if (selectedPos && selectedPos.r === r && selectedPos.c === c) {
                                pieceEl.classList.add('selected');
                            }
                            cell.appendChild(pieceEl);
                        }

                        if (validMoves.some(m => m.to.r === r && m.to.c === c)) {
                            cell.classList.add('valid');
                        }

                        cell.addEventListener('click', () => handleCellClick(r, c));
                        boardEl.appendChild(cell);
                    }
                }

                countRed.textContent = redCount;
                countBlack.textContent = blackCount;
            }

            function getValidMovesForPlayer(color, state = boardState) {
                let moves = [], captures = [];
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const piece = state[r][c];
                        if (piece && piece.color === color) {
                            getPieceMoves(r, c, state).forEach(m => {
                                if (m.captured) captures.push(m);
                                else moves.push(m);
                            });
                        }
                    }
                }
                return captures.length > 0 ? captures : moves;
            }

            // --- REGRA BRASILEIRA: DAMA VOADORA ---
            function getPieceMoves(r, c, state = boardState) {
                const piece = state[r][c];
                if (!piece) return [];
                const moves = [];
                const allDirections = [[-1, -1], [-1, 1], [1, -1], [1, 1]];

                if (piece.isKing) {
                    for (const [dr, dc] of allDirections) {
                        let step = 1;
                        while (true) {
                            const nr = r + dr * step;
                            const nc = c + dc * step;
                            if (!isInBounds(nr, nc)) break;
                            if (state[nr][nc] === null) {
                                moves.push({ from: { r, c }, to: { r: nr, c: nc }, captured: null });
                            } else {
                                break;
                            }
                            step++;
                        }
                    }

                    for (const [dr, dc] of allDirections) {
                        let step = 1;
                        let enemyPos = null;

                        while (true) {
                            const nr = r + dr * step;
                            const nc = c + dc * step;
                            if (!isInBounds(nr, nc)) break;

                            const target = state[nr][nc];
                            if (target !== null) {
                                if (enemyPos !== null) break;
                                if (target.color === piece.color) break;
                                else enemyPos = { r: nr, c: nc };
                            } else {
                                if (enemyPos !== null) {
                                    moves.push({
                                        from: { r, c },
                                        to: { r: nr, c: nc },
                                        captured: { r: enemyPos.r, c: enemyPos.c }
                                    });
                                }
                            }
                            step++;
                        }
                    }
                } else {
                    const forwardDirections = piece.color === RED ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];

                    for (const [dr, dc] of forwardDirections) {
                        const nr = r + dr;
                        const nc = c + dc;
                        if (isInBounds(nr, nc) && state[nr][nc] === null) {
                            moves.push({ from: { r, c }, to: { r: nr, c: nc }, captured: null });
                        }
                    }

                    for (const [dr, dc] of allDirections) {
                        const midR = r + dr, midC = c + dc;
                        const endR = r + (dr * 2), endC = c + (dc * 2);

                        if (isInBounds(endR, endC)) {
                            const midPiece = state[midR][midC];
                            const endPiece = state[endR][endC];
                            if (midPiece && midPiece.color !== piece.color && endPiece === null) {
                                moves.push({
                                    from: { r, c },
                                    to: { r: endR, c: endC },
                                    captured: { r: midR, c: midC }
                                });
                            }
                        }
                    }
                }

                return moves;
            }

            function isInBounds(r, c) { return r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE; }

            function handleCellClick(r, c) {
                if (mode === 'ai' && turn === BLACK) return;

                const piece = boardState[r][c];

                if (mustCaptureFrom) {
                    if (mustCaptureFrom.r !== r || mustCaptureFrom.c !== c) {
                        const move = validMoves.find(m => m.to.r === r && m.to.c === c);
                        if (move) executeMove(move);
                        return;
                    }
                }

                if (piece && piece.color === turn) {
                    sound.click();
                    selectedPos = { r, c };
                    const allPlayerMoves = getValidMovesForPlayer(turn);
                    const hasCaptures = allPlayerMoves.some(m => m.captured !== null);

                    if (hasCaptures) {
                        validMoves = allPlayerMoves.filter(m => m.from.r === r && m.from.c === c && m.captured !== null);
                    } else {
                        validMoves = allPlayerMoves.filter(m => m.from.r === r && m.from.c === c);
                    }
                    renderBoard();
                    return;
                }

                if (selectedPos) {
                    const move = validMoves.find(m => m.to.r === r && m.to.c === c);
                    if (move) executeMove(move);
                    else { selectedPos = null; validMoves = []; renderBoard(); }
                }
            }

            function executeMove(move) {
                const { from, to, captured } = move;
                const piece = boardState[from.r][from.c];

                boardState[to.r][to.c] = piece;
                boardState[from.r][from.c] = null;

                let wasCaptured = false;
                if (captured) {
                    boardState[captured.r][captured.c] = null;
                    wasCaptured = true;
                    comboCount++;
                    sound.capture();
                } else {
                    sound.move();
                }

                if (!piece.isKing) {
                    if ((piece.color === RED && to.r === 0) || (piece.color === BLACK && to.r === BOARD_SIZE - 1)) {
                        piece.isKing = true;
                        sound.king();
                    }
                }

                if (wasCaptured) {
                    const furtherMoves = getPieceMoves(to.r, to.c).filter(m => m.captured !== null);
                    if (furtherMoves.length > 0) {
                        mustCaptureFrom = { r: to.r, c: to.c };
                        selectedPos = { r: to.r, c: to.c };
                        validMoves = furtherMoves;

                        if (comboCount > 1) showComboToast(`COMBO x${comboCount}!`);
                        renderBoard();
                        resetBlitzTimer();

                        if (mode === 'ai' && turn === BLACK) {
                            setTimeout(() => triggerAiTurn(), 450);
                        }
                        return;
                    }
                }

                mustCaptureFrom = null; selectedPos = null; validMoves = []; comboCount = 0;

                if (checkGameOver()) return;

                turn = turn === RED ? BLACK : RED;
                updateUI();
                renderBoard();
                resetBlitzTimer();

                if (mode === 'ai' && turn === BLACK) {
                    setTimeout(() => triggerAiTurn(), 350);
                }
            }

            function showComboToast(text) {
                comboToast.textContent = text;
                comboToast.classList.add('show');
                setTimeout(() => comboToast.classList.remove('show'), 1200);
            }

            function triggerAiTurn() {
                tagBlack.textContent = 'Pensando...';

                setTimeout(() => {
                    const bestMove = getBestMoveAi();
                    if (bestMove) {
                        executeMove(bestMove);
                    } else {
                        checkGameOver();
                    }
                }, 300);
            }

            function getBestMoveAi() {
                let moves = mustCaptureFrom ? validMoves : getValidMovesForPlayer(BLACK);

                if (!moves || moves.length === 0) return null;
                if (aiDifficulty === 'easy') return moves[Math.floor(Math.random() * moves.length)];

                const depth = aiDifficulty === 'medium' ? 2 : 4;
                let bestScore = -Infinity;
                let bestMove = moves[0];

                for (const move of moves) {
                    const simulatedState = cloneBoard(boardState);
                    applyMoveToState(simulatedState, move);
                    let score = minimax(simulatedState, depth - 1, -Infinity, Infinity, false);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = move;
                    }
                }
                return bestMove;
            }

            function minimax(state, depth, alpha, beta, isMaximizing) {
                if (depth === 0) return evaluateBoard(state);
                const color = isMaximizing ? BLACK : RED;
                const moves = getValidMovesForPlayer(color, state);

                if (moves.length === 0) return isMaximizing ? -1000 : 1000;

                if (isMaximizing) {
                    let maxEval = -Infinity;
                    for (const move of moves) {
                        const nextState = cloneBoard(state);
                        applyMoveToState(nextState, move);
                        const evalVal = minimax(nextState, depth - 1, alpha, beta, false);
                        maxEval = Math.max(maxEval, evalVal);
                        alpha = Math.max(alpha, evalVal);
                        if (beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (const move of moves) {
                        const nextState = cloneBoard(state);
                        applyMoveToState(nextState, move);
                        const evalVal = minimax(nextState, depth - 1, alpha, beta, true);
                        minEval = Math.min(minEval, evalVal);
                        beta = Math.min(beta, evalVal);
                        if (beta <= alpha) break;
                    }
                    return minEval;
                }
            }

            function evaluateBoard(state) {
                let score = 0;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const piece = state[r][c];
                        if (piece) {
                            let val = piece.isKing ? 4 : 1;
                            if (r >= 2 && r <= 5 && c >= 2 && c <= 5) val += 0.2;
                            score += piece.color === BLACK ? val : -val;
                        }
                    }
                }
                return score;
            }

            function cloneBoard(state) { return state.map(row => row.map(cell => cell ? { ...cell } : null)); }

            function applyMoveToState(state, move) {
                const { from, to, captured } = move;
                const piece = state[from.r][from.c];
                state[to.r][to.c] = piece;
                state[from.r][from.c] = null;
                if (captured) state[captured.r][captured.c] = null;
                if (!piece.isKing) {
                    if ((piece.color === RED && to.r === 0) || (piece.color === BLACK && to.r === BOARD_SIZE - 1)) {
                        piece.isKing = true;
                    }
                }
            }

            function checkGameOver() {
                const redMoves = getValidMovesForPlayer(RED);
                const blackMoves = getValidMovesForPlayer(BLACK);
                let redPieceCount = 0, blackPieceCount = 0;

                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (boardState[r][c]?.color === RED) redPieceCount++;
                        if (boardState[r][c]?.color === BLACK) blackPieceCount++;
                    }
                }

                if (redPieceCount === 0 || redMoves.length === 0) { triggerGameOver(BLACK); return true; }
                if (blackPieceCount === 0 || blackMoves.length === 0) { triggerGameOver(RED); return true; }
                return false;
            }

            // --- DISPARO DE ANIMAÇÃO DE VITÓRIA PARA QUALQUER VENCEDOR ---
            function triggerGameOver(winner) {
                stopBlitzTimer();
                totalGames++;
                const winnerIsUser = (winner === RED);

                if (window.syncGameToFirebase) window.syncGameToFirebase(winnerIsUser);

                sound.win();
                spawnConfetti(winner);

                document.querySelectorAll(`.piece.${winner}`).forEach(p => {
                    p.classList.add('victory-dance');
                });

                modalCard.classList.remove('red-theme', 'black-theme');

                if (winner === RED) {
                    modalCard.classList.add('red-theme');
                    winnerTitle.textContent = "Vitória do Rubi!";
                    winnerTitle.style.color = "var(--ruby)";
                    winnerSubText.textContent = mode === 'ai' ? "Você venceu a Inteligência Artificial!" : "O Jogador 1 (Rubi) domina o tabuleiro.";
                    if (mode === 'ai') wins++;
                } else {
                    modalCard.classList.add('black-theme');
                    winnerTitle.textContent = mode === 'ai' ? "Vitória da IA!" : "Vitória do Ciano!";
                    winnerTitle.style.color = "var(--cyan)";
                    winnerSubText.textContent = mode === 'ai' ? "A Inteligência Artificial venceu a partida." : "O Jogador 2 (Ciano) domina o tabuleiro.";
                    if (mode === 'ai') losses++;
                }

                saveStats();

                setTimeout(() => {
                    victoryScreen.classList.add('show');
                }, 400);
            }

            function resetBlitzTimer() {
                stopBlitzTimer();
                if (!blitzMode) { clockRed.textContent = ''; clockBlack.textContent = ''; return; }
                blitzTimeLeft = 15;
                updateClockUI();

                blitzTimerInterval = setInterval(() => {
                    blitzTimeLeft--;
                    updateClockUI();
                    if (blitzTimeLeft <= 0) {
                        stopBlitzTimer();
                        turn = turn === RED ? BLACK : RED;
                        updateUI();
                        resetBlitzTimer();
                        if (mode === 'ai' && turn === BLACK) triggerAiTurn();
                    }
                }, 1000);
            }

            function stopBlitzTimer() { if (blitzTimerInterval) clearInterval(blitzTimerInterval); }

            function updateClockUI() {
                const targetClock = turn === RED ? clockRed : clockBlack;
                const otherClock = turn === RED ? clockBlack : clockRed;
                otherClock.textContent = '';
                targetClock.textContent = `00:${blitzTimeLeft < 10 ? '0' : ''}${blitzTimeLeft}`;
            }

            hintBtn.addEventListener('click', () => {
                if (hintsRemaining <= 0 || (mode === 'ai' && turn === BLACK)) return;
                const moves = getValidMovesForPlayer(turn);
                if (moves.length === 0) return;

                let bestMove = moves.find(m => m.captured !== null) || moves[0];
                hintsRemaining--;
                hintBadge.textContent = hintsRemaining;

                const targetCell = boardEl.querySelector(`[data-row="${bestMove.to.r}"][data-col="${bestMove.to.c}"]`);
                if (targetCell) {
                    targetCell.classList.add('hint-glow');
                    setTimeout(() => targetCell.classList.remove('hint-glow'), 1400);
                }
                sound.click();
            });

            function updateUI() {
                if (turn === RED) {
                    cardRed.classList.add('active'); cardBlack.classList.remove('active');
                    tagBlack.textContent = mode === 'ai' ? 'IA Aguardando' : 'Aguardando';
                } else {
                    cardBlack.classList.add('active'); cardRed.classList.remove('active');
                    tagBlack.textContent = mode === 'ai' ? 'IA Pensando...' : 'Sua Vez';
                }
            }

            vsPlayerBtn.addEventListener('click', () => {
                mode = 'pvp';
                vsPlayerBtn.classList.add('active');
                vsAiBtn.classList.remove('active');
                difficultyRow.style.display = 'none';
                nameBlack.textContent = 'Jogador 2';
                updateStatsUI();
                initGame();
            });

            vsAiBtn.addEventListener('click', () => {
                mode = 'ai';
                vsAiBtn.classList.add('active');
                vsPlayerBtn.classList.remove('active');
                difficultyRow.style.display = 'flex';
                nameBlack.textContent = 'Cyber IA';
                updateStatsUI();
                initGame();
            });

            document.querySelectorAll('[data-diff]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('[data-diff]').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    aiDifficulty = e.target.dataset.diff;
                    initGame();
                });
            });

            soundBtn.addEventListener('click', () => {
                sound.enabled = !sound.enabled;
                soundBtn.classList.toggle('active', sound.enabled);
                soundBtn.textContent = sound.enabled ? '🔊 Som' : '🔇 Mudo';
            });

            blitzBtn.addEventListener('click', () => {
                blitzMode = !blitzMode;
                blitzBtn.classList.toggle('active', blitzMode);
                resetBlitzTimer();
            });

            restartBtn.addEventListener('click', initGame);

            loadStats();
            initGame();
        });
    </script>
</body>
</html>
